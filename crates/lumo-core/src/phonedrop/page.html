<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Lumo · Phone drop</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f6fc; --panel: #fff; --panel-2: #e8eef8; --ink: #192233; --muted: #5d6c83; --line: #d7dfed;
  --island: #245bd6; --on-island: #fff; --ok: #186945; --ok-soft: #e4f4ec; --bad: #aa2828; --bad-soft: #fceaea;
  --wait: #715100; --wait-soft: #fff2ce;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); overflow-wrap: anywhere;
  font: 1rem/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  padding: max(1rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
}
.island { max-width: 34rem; margin: 0 auto 1.5rem; display: flex; align-items: center; gap: .5rem; font-size: .875rem; font-weight: 600; }
.live { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); }
.local { margin-inline-start: auto; color: var(--muted); font-weight: 400; }
main { max-width: 34rem; margin: 0 auto; display: grid; gap: 1.5rem; }
header { text-align: center; padding-block: .5rem; }
.device { width: 5.25rem; height: 5.25rem; margin: .5rem auto 1.5rem; display: grid; place-items: center; background: var(--panel); border-radius: 50%; box-shadow: 0 0 0 .6rem var(--panel-2), 0 0 0 .65rem var(--line); color: var(--island); }
.device svg { width: 2.75rem; height: 2.75rem; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 1.65rem; line-height: 1.25; letter-spacing: -.025em; margin: 0 0 .5rem; text-wrap: balance; }
h2 { font-size: 1rem; font-weight: 650; margin: 0; }
p { margin: 0; text-wrap: pretty; }
.sub { color: var(--muted); font-size: .875rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 1.5rem; padding: 1.25rem; display: grid; gap: 1rem; }
.receive { background: transparent; border: 0; padding: 0 .25rem; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.section-head span { color: var(--muted); font-size: .8rem; }
.btn {
  appearance: none; border: 0; border-radius: 1rem; min-height: 3rem; padding: .875rem 1rem; font: inherit; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: .625rem; cursor: pointer; text-decoration: none;
  -webkit-tap-highlight-color: transparent; width: 100%;
}
.btn svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--island); color: var(--on-island); }
.btn.quiet { background: var(--panel-2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
:where(button, a, input):focus-visible { outline: 3px solid var(--island); outline-offset: 3px; }
.row { display: flex; gap: .75rem; }
.row .btn { flex: 1; min-width: 0; }
input[type=file] { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
li.file { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding-block: .625rem; border-top: 1px solid var(--line); }
li.file:first-child { border-top: 0; }
.kind { width: 2.5rem; height: 2.5rem; border-radius: .75rem; background: var(--panel-2); display: grid; place-items: center; color: var(--island); }
.kind svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.name { min-width: 0; }
.name b { display: block; font-weight: 600; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name span { color: var(--muted); font-size: .8125rem; }
.save { background: var(--panel); color: var(--island); border: 1px solid var(--line); border-radius: 1rem; min-height: 3rem; padding: .75rem; font-weight: 600; font-size: .875rem; text-decoration: none; }
.empty { color: var(--muted); font-size: .875rem; padding-block: .5rem; }
.status { border-radius: .875rem; padding: .875rem; font-size: .875rem; display: flex; gap: .625rem; align-items: flex-start; }
.status.wait { background: var(--wait-soft); color: var(--wait); }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.spin { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; flex: none; margin-top: .2rem; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { appearance: none; border: 0 solid; display: block; width: 100%; height: .5rem; border-radius: 1rem; overflow: hidden; background: var(--panel-2); }
.bar::-webkit-progress-bar { background: var(--panel-2); }
.bar::-webkit-progress-value { background: var(--island); border-radius: 1rem; }
.bar::-moz-progress-bar { background: var(--island); border-radius: 1rem; }
.total { display: flex; justify-content: space-between; gap: .75rem; color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
.foot { color: var(--muted); font-size: .8125rem; text-align: center; padding-inline: .5rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-right-color: currentColor; } }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171e; --panel: #20252f; --panel-2: #30394a; --ink: #edf2fc; --muted: #a6b4ca; --line: #3a465b; --island: #a7c7ff; --on-island: #152d59; --ok: #8ad9b1; --ok-soft: #183c2d; --bad: #ffb7b7; --bad-soft: #4c2429; --wait: #edd186; --wait-soft: #40361e; }
}
</style>
</head>
<body>
<div class="island"><span class="live" aria-hidden="true"></span><span>Lumo</span><span class="local">Local network</span></div>
<main>
  <header>
    <div class="device" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="18" rx="3"/><path d="M16 22v6M10 28h12M12 13l4-4 4 4M16 9v9"/></svg></div>
    <h1 id="title">Send to your PC</h1>
    <p class="sub" id="where">Share directly with a nearby PC on the same Wi-Fi.</p>
  </header>

  <section class="card" aria-labelledby="send-h">
    <div class="section-head"><h2 id="send-h">Send files</h2><span>Approval on PC</span></div>
    <button class="btn primary" type="button" id="pick-label">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
      Choose photos or files
    </button>
    <input id="pick" name="files" type="file" multiple aria-label="Choose photos or files" tabindex="-1">
    <ul id="chosen" hidden></ul>
    <div class="total" id="chosen-total" hidden><span id="chosen-count"></span><span id="chosen-size"></span></div>
    <div class="row" id="send-row" hidden>
      <button class="btn quiet" id="clear" type="button">Clear</button>
      <button class="btn primary" id="send" type="button">Send</button>
    </div>
    <div id="progress" hidden>
      <progress class="bar" id="bar" max="100" value="0" aria-label="Files sent"></progress>
      <div class="total" style="margin-top:8px"><span id="p-file"></span><span id="p-bytes"></span></div>
    </div>
    <div class="status" id="status" hidden role="status" aria-live="polite"><span class="spin" id="spin" hidden></span><span id="status-text"></span></div>
  </section>

  <section class="card receive" aria-labelledby="shelf-h">
    <h2 id="shelf-h">Save from this PC</h2>
    <ul id="offer"><li class="empty">Loading…</li></ul>
  </section>

  <p class="foot" id="foot">This page works while Phone drop is open on the PC.</p>
</main>

<script>
(function () {
  "use strict";
  var base = location.pathname.replace(/[^\/]*$/, "");
  var $ = function (id) { return document.getElementById(id); };
  var pcName = "your PC";
  var chosen = [];
  var sending = false;
  var generation = -1;
  var failures = 0;

  var ICONS = {
    photo: '<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5z"/><path d="M4 15l4.5-4.5L13 15l2.5-2.5L20 17"/><circle cx="15.5" cy="9.5" r="1.3"/>',
    video: '<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h9A1.5 1.5 0 0 1 16 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 16.5z"/><path d="M16 10.5l4-2.5v8l-4-2.5"/>',
    file: '<path d="M7.5 3H14l5 5v11.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3z"/><path d="M14 3v5h5"/>'
  };

  function kindOf(name) {
    var ext = (name.split(".").pop() || "").toLowerCase();
    if (/^(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/.test(ext)) return "photo";
    if (/^(mp4|mov|m4v|avi|mkv|webm)$/.test(ext)) return "video";
    return "file";
  }

  function fmt(n) {
    if (n < 1000) return n + (n === 1 ? " byte" : " bytes");
    if (n < 1e6) return Math.round(n / 1e3) + " KB";
    if (n < 1e9) { var mb = n / 1e6; return (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + " MB"; }
    return (n / 1e9).toFixed(1) + " GB";
  }

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function icon(kind) {
    var span = document.createElement("span");
    span.className = "kind";
    span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[kind] + "</svg>";
    return span;
  }

  function fileRow(name, size, action) {
    var li = document.createElement("li");
    li.className = "file";
    li.appendChild(icon(kindOf(name)));
    var text = document.createElement("span");
    text.className = "name";
    var b = document.createElement("b");
    b.textContent = name;
    var s = document.createElement("span");
    s.textContent = fmt(size);
    text.appendChild(b);
    text.appendChild(s);
    li.appendChild(text);
    li.appendChild(action || document.createElement("span"));
    return li;
  }

  function setStatus(text, kind) {
    var el = $("status");
    if (!text) { el.hidden = true; return; }
    el.hidden = false;
    el.className = "status " + kind;
    $("spin").hidden = kind !== "wait";
    $("status-text").textContent = text;
  }

  function renderChosen() {
    var list = $("chosen");
    list.textContent = "";
    var total = 0;
    chosen.forEach(function (f) { total += f.size; list.appendChild(fileRow(f.name, f.size)); });
    var any = chosen.length > 0;
    list.hidden = !any;
    $("chosen-total").hidden = !any;
    $("send-row").hidden = !any || sending;
    $("pick-label").hidden = any || sending;
    $("chosen-count").textContent = plural(chosen.length, "file", "files");
    $("chosen-size").textContent = fmt(total);
  }

  function renderOffer(files) {
    var list = $("offer");
    list.textContent = "";
    if (!files.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing to save yet. Files you drop on the island show up here.";
      list.appendChild(li);
      return;
    }
    files.forEach(function (f) {
      var a = document.createElement("a");
      a.className = "save";
      a.href = base + "get/" + generation + "/" + f.n;
      a.setAttribute("download", f.name);
      a.textContent = "Save";
      list.appendChild(fileRow(f.name, f.size, a));
    });
  }

  function closed() {
    $("foot").textContent = "Phone drop is closed on the PC. Open it on the island again and scan the new code.";
    $("offer").textContent = "";
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Not connected.";
    $("offer").appendChild(li);
  }

  function loadInfo() {
    return fetch(base + "info", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("status " + r.status);
      return r.json();
    }).then(function (v) {
      failures = 0;
      pcName = v.name || pcName;
      $("title").textContent = "Send to " + pcName;
      if (v.generation !== generation) {
        generation = v.generation;
        renderOffer(v.files || []);
      }
    }).catch(function () {
      failures += 1;
      if (failures >= 3) closed();
    });
  }

  function reasonText(why) {
    switch (why) {
      case "declined": return "Declined on " + pcName + ".";
      case "timeout": return "No answer from " + pcName + ". Send again to ask once more.";
      case "busy": return pcName + " is taking files from another phone. Try again in a moment.";
      case "closed": return "Phone drop was closed on " + pcName + ".";
      case "too-many": return "That's more than 500 files. Send fewer at once.";
      case "too-large": return "That's too much for one send. Send fewer files at once.";
      case "size": return "A file changed while it was sent. Nothing was kept. Try again.";
      case "pc-error": return pcName + " couldn't save the files. Nothing was kept.";
      case "network": return "Lost the connection to " + pcName + ". Check that both are on the same Wi-Fi.";
      default: return "The connection dropped. Nothing was kept. Try again.";
    }
  }

  function fail(why) {
    setStatus(reasonText(why), "bad");
    sending = false;
    $("progress").hidden = true;
    renderChosen();
  }

  function put(transfer, i, file, before, total) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open("PUT", base + "up/" + transfer + "/" + i);
      x.upload.onprogress = function (e) {
        var done = before + (e.lengthComputable ? e.loaded : 0);
        $("bar").value = total ? Math.min(100, done / total * 100) : 100;
        $("p-bytes").textContent = fmt(done) + " of " + fmt(total);
      };
      x.onload = function () {
        var v = null;
        try { v = JSON.parse(x.responseText); } catch (e) { }
        if (v && v.ok) resolve(v); else reject((v && v.why) || "failed");
      };
      x.onerror = function () { reject("network"); };
      x.ontimeout = function () { reject("network"); };
      x.send(file);
    });
  }

  function send() {
    if (sending || !chosen.length) return;
    sending = true;
    renderChosen();
    setStatus("Waiting for " + pcName + " to accept. Look at the island on the PC.", "wait");
    var files = chosen.slice();
    var body = JSON.stringify({ files: files.map(function (f) { return { name: f.name, size: f.size }; }) });
    fetch(base + "ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        if (!v.ok) throw v.why || "failed";
        var total = files.reduce(function (s, f) { return s + f.size; }, 0);
        setStatus("", "");
        $("progress").hidden = false;
        $("bar").value = 0;
        var before = 0;
        var chain = Promise.resolve();
        files.forEach(function (f, i) {
          chain = chain.then(function () {
            $("p-file").textContent = "Sending " + (i + 1) + " of " + files.length;
            return put(v.transfer, i, f, before, total).then(function () { before += f.size; });
          });
        });
        return chain;
      })
      .then(function () {
        sending = false;
        $("progress").hidden = true;
        var n = chosen.length;
        chosen = [];
        $("pick").value = "";
        renderChosen();
        setStatus("Sent. " + plural(n, "file is", "files are") + " on the Shelf.", "ok");
      })
      .catch(function (why) { fail(typeof why === "string" ? why : "network"); });
  }

  $("pick-label").addEventListener("click", function () { $("pick").click(); });
  $("pick").addEventListener("change", function () {
    chosen = Array.prototype.slice.call($("pick").files || []);
    setStatus("", "");
    renderChosen();
  });
  $("clear").addEventListener("click", function () {
    chosen = [];
    $("pick").value = "";
    setStatus("", "");
    renderChosen();
  });
  $("send").addEventListener("click", send);

  loadInfo();
  setInterval(function () {
    if (document.visibilityState === "visible" && !sending && failures < 3) loadInfo();
  }, 4000);
})();
</script>
</body>
</html>
