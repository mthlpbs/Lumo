name: ci
run-name: ci · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build and test release assets without publishing
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.100.0

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build: ${{ steps.tag.outputs.build }}
      package: ${{ steps.tag.outputs.package }}
    steps:
      - name: Identify app release
        id: tag
        shell: python3 {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import os, re
          tag = os.environ.get('RELEASE_TAG', '')
          event = os.environ['EVENT_NAME']
          package = event == 'workflow_dispatch' or (event == 'release' and re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+', tag) is not None)
          build = package or event in ('push', 'pull_request')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(build).lower()}\n')
              output.write(f'package={str(package).lower()}\n')
          print(f'Event: {event}; tag: {tag or "none"}; test: {build}; package: {package}')

  windows:
    name: Windows tests
    needs: classify
    if: needs.classify.outputs.build == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source revision
        run: |
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the source commit' }
          "Source commit: $source" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Event: $env:GITHUB_EVENT_NAME; ref: $env:GITHUB_REF" | Add-Content $env:GITHUB_STEP_SUMMARY
          'Re-running an older release job keeps its original commit. Use Run workflow on the updated branch to test fixes.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Validate release version
        id: version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import datetime, os, pathlib, re, tomllib
          root = pathlib.Path('.')
          version = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['package']['version']
          if not re.fullmatch(r'[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*', version):
              raise SystemExit(f'Expected year.monthday.build with no leading zeros, got {version}')
          year, monthday, build = map(int, version.split('.'))
          if any(part > 65535 for part in (year, monthday, build)):
              raise SystemExit('Windows version fields must not exceed 65535')
          try:
              datetime.date(year, monthday // 100, monthday % 100)
          except ValueError as error:
              raise SystemExit(f'Invalid calendar date in version {version}: {error}')
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag not in (version, f'v{version}'):
              raise SystemExit(f'Release tag {tag} must match Cargo.toml version {version} (or v{version}). Prepare and commit the version files before publishing the matching release.')
          packages = tomllib.loads((root / 'Cargo.lock').read_text())['package']
          for name in ('lumo', 'lumo-core'):
              if not any(p['name'] == name and p['version'] == version for p in packages):
                  raise SystemExit(f'Cargo.lock must contain {name} version {version}')
          checks = {
              'installer/lumo.nsi': [f'!define VERSION "{version}"', f'VIProductVersion "{version}.0"'],
              'installer/lumo.iss': [f'#define AppVersion "{version}"'],
              'crates/lumo/res/lumo.rc': [f'FILEVERSION {version.replace(".", ",")},0', f'PRODUCTVERSION {version.replace(".", ",")},0', f'VALUE "FileVersion", "{version}\\0"', f'VALUE "ProductVersion", "{version}\\0"'],
              'crates/lumo/res/lumo.manifest': [f'version="{version}.0"'],
          }
          for file, expected in checks.items():
              contents = (root / file).read_text(encoding='utf-8')
              for value in expected:
                  if value not in contents:
                      raise SystemExit(f'{file} must contain {value}')
          if not (root / f'docs/release-notes/v{version}.md').is_file():
              raise SystemExit(f'Missing docs/release-notes/v{version}.md')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')

      - name: Test CI tooling
        run: |
          python -m unittest discover -s tools -p test_ci_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Test runner checks failed' }
          python tools/test_release_workflow.py
          if ($LASTEXITCODE -ne 0) { throw 'Release workflow checks failed' }
          python -m unittest discover -s tools -p test_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Version checks failed' }

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
          rustc --version --verbose

      - name: Test workspace
        run: |
          python tools/ci_tests.py --target x86_64-pc-windows-msvc --out test-out
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed; see test-out/results.json and case logs' }

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumo-tests
          retention-days: 7
          path: test-out/
          if-no-files-found: ignore

  package:
    name: Windows package and smoke checks
    needs: [classify, windows]
    if: needs.classify.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
          rustc --version --verbose

      - name: Build Windows app
        run: |
          cargo build -p lumo --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      # lumo.nsi uses Target amd64-unicode, unavailable in the runner's stock NSIS.
      - name: Install NSIS with native x64 support
        uses: negrutiu/nsis-install@9c575d44c2938a43e38a305caeb403de90303c60 # v3
        with:
          distro: negrutiu
          arch: amd64
          version: latest

      - name: Package installer and portable app
        env:
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          $exe = (Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/release/lumo.exe')).FullName
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          python tools/package_portable.py --exe "$exe" --out "$dist/Lumo-$env:APP_VERSION-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP packaging failed' }
          makensis /V2 "/DEXE=$exe" "/DOUTDIR=$dist" installer/lumo.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          $assets = @("$dist/Lumo-Setup-$env:APP_VERSION.exe", "$dist/Lumo-$env:APP_VERSION-portable.zip")
          $checksums = foreach ($asset in $assets) {
            $file = Get-Item -LiteralPath $asset
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
            "$($file.Name): $($file.Length) bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $checksums | Set-Content -LiteralPath "$dist/SHA256SUMS.txt" -Encoding ascii
          'Update checks: opt-in, twice a day; no permanent updater worker or per-frame animation. See smoke-out for idle memory and CPU metrics.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Check Windows desktop and idle costs
        run: ./tools/ci-smoke.ps1 -Exe ./target/x86_64-pc-windows-msvc/release/lumo.exe -Out smoke-out

      - name: Check installer
        env:
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: ./tools/ci-installer.ps1 -Setup "$env:GITHUB_WORKSPACE/dist/Lumo-Setup-$env:APP_VERSION.exe" -Version $env:APP_VERSION

      - name: Save screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumo-screens
          retention-days: 7
          path: |
            smoke-out/
            installer-out/
          if-no-files-found: ignore

      - name: Save installer
        uses: actions/upload-artifact@v7
        with:
          name: lumo-setup
          retention-days: 7
          path: dist/Lumo-Setup-*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Save portable app and checksums
        uses: actions/upload-artifact@v7
        with:
          name: lumo-portable
          retention-days: 7
          path: |
            dist/Lumo-*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Summarize dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          'Dry run completed. A published release with a matching numeric or v-prefixed version tag would receive the installer, portable ZIP and SHA256SUMS.txt. No tag or release was created or changed. Update-feed deployment remains disabled.' | Add-Content $env:GITHUB_STEP_SUMMARY

  upload:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lumo-setup
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: lumo-portable
          path: dist
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber -- Lumo-Setup-*.exe Lumo-*-portable.zip SHA256SUMS.txt

  package-managers:
    # A release event fires before the build assets exist. Wait for upload;
    # calling the workflow directly also works with GITHUB_TOKEN-created releases.
    needs: upload
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/package-managers.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      publish: true
    secrets:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
